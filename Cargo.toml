[package]
edition = "2021"
name = "upward"
version = "0.1.1"
description = "A utility for updating your background using beautiful, permissively licensed images."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Download the image ourselves instead of using wallpaper's `from_url` feature,
# which pins reqwest 0.11 / hyper 0.14 / h2 0.3 (RUSTSEC-2026-0258).
wallpaper = "3"
ureq = "3"
dirs = "7"

[profile.release]
strip = true