[package]
edition = "2021"
name = "upward"
version = "0.1.1"
description = "A utility for updating your background using beautiful, permissively licensed images."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# `wallpaper`'s own `from_url` feature pulls in reqwest 0.11 -> hyper 0.14 -> h2
# 0.3, which is stuck on RUSTSEC-2026-0258. We download the image ourselves
# instead and hand the crate a path.
wallpaper = "3"
dirs = "6"
ureq = "3"

[profile.release]
strip = true
